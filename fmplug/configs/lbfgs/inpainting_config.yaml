measurement:
  noise: 
    name: gaussian
    sigma: 0.03
  operator:
    name: inpainting
  mask_opt:
    mask_type: random
    mask_prob_range: [0.7, 0.7]  # for random
    image_size: 512

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/dataset_deg/"
  save_folder: "/scratch.global/wan01530/FMPlug/experiment"
  img_size: 512
  scale_factor: 4

  method: "heun2"
  alpha: 0.2
  t_end: 0.05
  NFE: 3
  batch_size: 1
  guidance_scale: 1.0
  lr: 1.
  lr_t_ada: 0.05
  decay_factor: 0.98
  epochs: 20
  loss_multiplier: 1.0
  vae_weight: 0.0
  lpips_weight: 0.0
  TV_reg_weight: 0.0
  loss_fn: "mse"
  data_type: torch.bfloat16
  optimizer_select: "lbfgs"

