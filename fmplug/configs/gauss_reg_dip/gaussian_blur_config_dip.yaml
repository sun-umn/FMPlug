measurement:
  noise: 
    name: gaussian
    sigma: 0.03
  operator:
    name: gaussian_blur
    kernel_size: 61
    intensity: 3.0
  kernel_opt:
    kernel: gaussian
    kernel_size: 61
    intensity: 3.0

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/dataset_deg_1024"
  save_folder: "/scratch.global/wan01530/FMPlug/experiment-FMPlug-OT-W-R-Calibrated-DIP"
  img_size: 512

  method: "heun2"
  alpha: 0.8
  t_end: 0.00
  NFE: 3
  batch_size: 1
  guidance_scale: 0.0
  lr_z: [0.005]
  lr_dec: []
  lr_alpha_ada: 0.005
  decay_factor: 1.0
  epochs: 1000
  loss_multiplier: 1000.0
  vae_weight: 0.0
  lpips_weight: 0.0
  TV_reg_weight: 0.0
  is_gauss_reg: True
  loss_fn: "mse"
  data_type: torch.bfloat16
  optimizer_select: "adam"
  
  residual_type: "DIP"

  dip_in_channel: 16
  dip_out_channel: 3
  dip_num_channels_down: [256, 256, 256, 256]
  dip_num_channels_up: [256, 256, 256, 256]
  dip_num_channels_skip: [16, 16, 16, 16]
  dip_filter_size_down: 3
  dip_filter_size_up: 3
  dip_filter_skip_size: 1
  dip_upsample_mode: "bilinear"
  dip_need_sigmoid: False
  dip_need_bias: True
  dip_pad: "zero"
  dip_act_fun: "LeakyReLU"

  dip_lr: 0.0001
  target_norm: 0.05

  es_window_size: 50
  es_patience: 50
  es_min_epochs: 100
  es_delta: 0.0000000001

  finetune_decoder_blocks_interval: 100