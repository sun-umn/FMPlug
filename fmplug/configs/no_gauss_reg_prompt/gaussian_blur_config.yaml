  is_gauss_reg: False
  is_calibrate: True
  loss_fn: "mse"
  data_type: torch.bfloat16
  optimizer_select: "adam"
  
  es_window_size: 50
  es_patience: 50
  es_min_epochs: 100
  es_delta: 0.000000001

  finetune_decoder_blocks_interval: 100