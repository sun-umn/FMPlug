measurement:
  noise:
    name: gaussian
    sigma: 0.03
  operator:
    name: gaussian_blur
    kernel_size: 65
    intensity: 3.0
  kernel_opt:
    kernel: gaussian
    kernel_size: 65
    intensity: 3.0

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/dataset_deg/"
  save_folder: "/scratch.global/wan01530/FMPlug/experiments"
