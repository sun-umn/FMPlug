measurement:
  noise: 
    name: gaussian
    sigma: 0.03
  operator:
    name: gaussian_blur
    kernel_size: 61
    intensity: 3.0
  kernel_opt:
    kernel: gaussian
    kernel_size: 61
    intensity: 3.0

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/data_subset"
  save_folder: "/scratch.global/wan01530/FMPlug/experiment-FMPlug-OT-W-R-Calibrated-prompt-tune"
  img_size: 512

  method: "euler"
  alpha: 0.8
  t_end: 0.00
  NFE: 6
  batch_size: 1
  guidance_scale_init: 0.0
  guidance_scale_max: 7.5
  lr_z: [0.5]
  lr_dec: []
  lr_emb: [0.5]
  lr_alpha_ada: 0.005
  decay_factor: 1.0
  epochs: 1000
  loss_multiplier: 1.0
  vae_weight: 0.0
  lpips_weight: 0.0
  TV_reg_weight: 0.0
  is_gauss_reg: True
  is_calibrate: True
  loss_fn: "mse"
  data_type: torch.bfloat16
  optimizer_select: "adam"
  
  es_window_size: 50
  es_patience: 50
  es_min_epochs: 200
  es_delta: 0.000000001

  finetune_decoder_blocks_interval: 100