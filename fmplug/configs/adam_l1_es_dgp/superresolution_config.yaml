measurement:
  noise: 
    name: gaussian
    sigma: 0.03
  operator:
    name: super_resolution
    in_shape: [1, 3, 512, 512]
    scale_factor: 4

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/dataset_deg/"
  save_folder: "/scratch.global/wan01530/FMPlug/experiment-FT-noprompt"
  img_size: 512
  scale_factor: 4

  method: "heun2"
  alpha: 0.5
  t_end: 0.0
  NFE: 5
  batch_size: 1
  guidance_scale: 0.0
  lr: 0.01
  lr_dec: 0.00001
  lr_t_ada: 0.1
  decay_factor: 0.95
  epochs: 1000
  loss_multiplier: 1.0
  vae_weight: 0.0
  lpips_weight: 0.5
  TV_reg_weight: 0.0
  loss_fn: "l1"
  data_type: torch.bfloat16
  optimizer_select: "adam"
  
  es_window_size: 25
  es_patience: 10
  es_min_epochs: 600
  es_delta: 0.0001

  finetune_decoder_blocks_interval: 200
