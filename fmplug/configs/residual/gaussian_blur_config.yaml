measurement:
  noise: 
    name: gaussian
    sigma: 0.03
  operator:
    name: gaussian_blur
    kernel_size: 61
    intensity: 3.0
  kernel_opt:
    kernel: gaussian
    kernel_size: 61
    intensity: 3.0

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/dataset_deg_1024/"
  save_folder: "/scratch.global/wan01530/FMPlug/experiment-OT-FMPlug-W-R-Res"
  img_size: 512

  method: "heun2"
  alpha: 0.8
  t_end: 0.0
  NFE: 3
  batch_size: 1
  guidance_scale: 0.0
  lr_z: [0.5]
  # lr_y: [0.1, 0.05, 0.02, 0.01]
  lr_dec: []
  lr_alpha_ada: 0.005
  decay_factor: 0.95
  epochs: 1000
  loss_multiplier: 1.0
  vae_weight: 0.0
  lpips_weight: 0.0
  TV_reg_weight: 0.0
  is_gauss_reg: True
  loss_fn: "l1"
  data_type: torch.bfloat16
  optimizer_select: "adam"
  
  es_window_size: 50
  es_patience: 25
  es_min_epochs: 100
  es_delta: 0.000000005

  finetune_decoder_blocks_interval: 100