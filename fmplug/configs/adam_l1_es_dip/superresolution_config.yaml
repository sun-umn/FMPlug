measurement:
  noise: 
    name: gaussian
    sigma: 0.03
  operator:
    name: super_resolution
    in_shape: [1, 3, 512, 512]
    scale_factor: 4

fmplug:
  data_folder: "/scratch.global/wan01530/FMPlug/dataset_deg/"
  save_folder: "/scratch.global/wan01530/FMPlug/experiment-DIP-Residual"
  img_size: 512
  scale_factor: 4

  method: "heun2"
  alpha: 0.9
  t_end: 0.0
  NFE: 3
  batch_size: 1
  guidance_scale: 0.0
  lr: 0.02
  lr_t_ada: 0.1
  decay_factor: 0.98
  epochs: 2000
  loss_multiplier: 1.0
  vae_weight: 1.0
  lpips_weight: 1.0
  TV_reg_weight: 0.0
  loss_fn: "l1"
  data_type: torch.bfloat16
  optimizer_select: "adam"

  es_window_size: 100
  es_patience: 25
  es_min_epochs: 200
  es_delta: 0.000001

  
  dip_in_channel: 16
  dip_out_channel: 3
  dip_num_channels_down: [128, 128, 128, 128]
  dip_num_channels_up: [128, 128, 128, 128]
  dip_num_channels_skip: [16, 16, 16, 16]
  dip_filter_size_down: 3
  dip_filter_size_up: 3
  dip_filter_skip_size: 1
  dip_upsample_mode: "bilinear"
  dip_need_sigmoid: True
  dip_need_bias: True
  dip_pad: "zero"
  dip_act_fun: "LeakyReLU"

  siren_in_features: 2
  siren_hidden_features: 512
  siren_out_features: 3
  siren_hidden_layers: 2
  siren_outermost_linear: True

  dip_lr: 0.01
  target_norm: 0.05
